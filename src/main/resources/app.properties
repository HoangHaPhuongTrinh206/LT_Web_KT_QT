# ===== Gửi mail OTP =====
# mail.enabled=true để gửi mail thật (Gmail: dùng "Mật khẩu ứng dụng" 16 ký tự, không dùng mật khẩu đăng nhập)
mail.enabled=false
mail.host=smtp.gmail.com
mail.port=587
mail.username=your_email@gmail.com
mail.password=your_app_password

# ===== OTP =====
# otp.demo=true : nếu mail không gửi được thì hiển thị OTP ngay trên trang xác thực (tiện khi thi/demo)
otp.demo=true
otp.expire.minutes=5

# ===== Upload poster =====
# để trống = <thư mục user>/de03_uploads
upload.dir=
